name: Tests

on:
  push:
    branches: [main, "release/**"]
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system Qt libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pyflakes
      - name: Lint (undefined names / syntax)
        run: python -m pyflakes src inspector_rabbit.py tests | grep -v "imported but unused\|f-string is missing placeholders\|redefinition of unused\|is assigned to but never used" && exit 1 || true
      - name: Offline unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests/test_offline.py
      - name: GUI builds headless
        env:
          QT_QPA_PLATFORM: offscreen
          INSPECTOR_RABBIT_HOME: ${{ runner.temp }}
        run: python -c "from PyQt6.QtWidgets import QApplication; app=QApplication([]); from src.gui.main_window import MainWindow; MainWindow(); print('ok')"
